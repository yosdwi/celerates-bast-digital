name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run python -m compileall -q src tests
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest
      - run: scripts/check-ops.sh
        env:
          SECRETS_GID: "0"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: digital-bast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test "$(docker image inspect digital-bast:ci --format '{{.Config.User}}')" = "10001:10001"
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: digital-bast:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  migration-smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: digital_bast
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: digital_bast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digital_bast -d digital_bast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_DSN: postgresql://digital_bast:ci-only@127.0.0.1:5432/digital_bast
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SESSION_SECRET: ci-only-not-production
      PREFECT_API_URL: http://127.0.0.1:4200/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - name: Migration gate
        run: uv run alembic upgrade head
      - name: Migration idempotency gate
        run: uv run alembic upgrade head
      - name: Smoke and shadow gate
        run: |
          uv run uvicorn digital_bast.web.asgi:app --host 127.0.0.1 --port 8000 > /tmp/web.log 2>&1 &
          web_pid=$!
          uv run prefect server start --host 127.0.0.1 --port 4200 > /tmp/prefect.log 2>&1 &
          prefect_pid=$!
          trap 'kill "$web_pid" "$prefect_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:4200/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              cat /tmp/web.log
              cat /tmp/prefect.log
              exit 1
            fi
            sleep 1
          done
          WEB_URL=http://127.0.0.1:8000 PREFECT_URL=http://127.0.0.1:4200 scripts/smoke.sh
