name: Wire Whatsmeow Interactive Parser Once

on:
  push:
    branches:
      - feat/whatsmeow-transport
    paths:
      - ".github/workflows/wire-whatsmeow-interactive-parser-once.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsmeow-transport
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: whatsmeow-session/go.sum
      - name: Wire parser and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('whatsmeow-session/bridge.go')
          s = p.read_text()
          old = 'text := messageText(evt.Message)'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 messageText call sites, got {count}')
          s = s.replace(old, 'text := messageTextCompat(evt.Message)')
          p.write_text(s)
          PY
          gofmt -w whatsmeow-session/bridge.go whatsmeow-session/interactive_inbound.go whatsmeow-session/interactive_inbound_test.go
          (cd whatsmeow-session && go test ./... && go vet ./... && go build -trimpath -o /tmp/digital-bast-whatsmeow .)
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsmeow-session/bridge.go whatsmeow-session/interactive_inbound.go whatsmeow-session/interactive_inbound_test.go
          git commit -m 'fix: route interactive replies through whatsmeow compatibility parser'
          git push origin HEAD:feat/whatsmeow-transport
