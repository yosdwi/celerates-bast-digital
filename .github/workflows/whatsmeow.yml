name: Whatsmeow Transport

on:
  pull_request:
    paths:
      - "whatsmeow-session/**"
      - ".github/workflows/whatsmeow.yml"
  push:
    branches:
      - main
    paths:
      - "whatsmeow-session/**"
      - ".github/workflows/whatsmeow.yml"

permissions:
  contents: read

concurrency:
  group: whatsmeow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Resolve module lock (initial pin)
        working-directory: whatsmeow-session
        run: |
          go mod tidy
          echo '=== GENERATED GO.MOD ==='
          cat go.mod
          echo '=== GENERATED GO.SUM ==='
          cat go.sum
          echo '=== END GENERATED MODULE LOCK ==='
      - name: Format gate
        run: test -z "$(gofmt -l whatsmeow-session)"
      - name: Vet
        working-directory: whatsmeow-session
        run: go vet ./...
      - name: Test
        working-directory: whatsmeow-session
        run: go test ./...
      - name: Build
        working-directory: whatsmeow-session
        run: go build -trimpath -o /tmp/digital-bast-whatsmeow .
