name: Whatsmeow Transport

on:
  pull_request:
    paths:
      - "whatsmeow-session/**"
      - ".github/workflows/whatsmeow.yml"
  push:
    branches:
      - main
    paths:
      - "whatsmeow-session/**"
      - ".github/workflows/whatsmeow.yml"

permissions:
  contents: read

concurrency:
  group: whatsmeow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: whatsmeow-session/go.sum
      - name: Verify module files are tidy
        working-directory: whatsmeow-session
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format gate
        run: |
          gofmt -w whatsmeow-session
          git diff --exit-code -- 'whatsmeow-session/*.go'
      - name: Vet
        working-directory: whatsmeow-session
        run: go vet ./...
      - name: Test
        working-directory: whatsmeow-session
        run: go test ./...
      - name: Build
        working-directory: whatsmeow-session
        run: go build -trimpath -o /tmp/digital-bast-whatsmeow .
