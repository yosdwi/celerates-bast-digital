name: Inspect Actual WhatsApp Runtime

on:
  push:
    branches:
      - ops/deploy-wa-session-once-20260829
    paths:
      - .github/workflows/inspect-systemd-wa.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Locate WhatsApp runtime read-only
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' <<'REMOTE'
          set +e
          echo '=== docker containers identity ==='
          docker ps -a --no-trunc --format 'id={{.ID}} name={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}' 2>/dev/null || true
          echo '=== all host processes plausibly related ==='
          ps -eo unit,pid,ppid,user,lstart,cmd | grep -Ei 'whatsapp|baileys|bridge|session|celerates|bast|node|npm|pnpm|bun|pm2' | grep -v grep || true
          echo '=== system unit files under /etc/systemd/system ==='
          find /etc/systemd/system -maxdepth 3 -type f -o -type l 2>/dev/null | sort | while read -r file; do
            if grep -Eiq 'whatsapp|baileys|bridge|session|celerates|bast|node|npm|pnpm|bun|pm2' "$file" 2>/dev/null; then
              echo "--- $file ---"
              sed -n '1,160p' "$file" 2>/dev/null
            fi
          done
          echo '=== debian user systemd files ==='
          for base in /home/debian/.config/systemd/user /home/debian/.local/share/systemd/user; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 3 -type f -o -type l 2>/dev/null | sort | while read -r file; do
              echo "--- $file ---"
              sed -n '1,160p' "$file" 2>/dev/null
            done
          done
          echo '=== debian user running units ==='
          uid=$(id -u debian 2>/dev/null)
          if [ -n "$uid" ] && [ -S "/run/user/$uid/bus" ]; then
            sudo -u debian XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" systemctl --user list-units --type=service --all --no-pager 2>/dev/null || true
          fi
          echo '=== erroneous docker wa container ==='
          docker ps -a --filter 'name=digital-bast-v2-wa-session-1' --format 'name={{.Names}} status={{.Status}} image={{.Image}}' 2>/dev/null || true
          REMOTE
