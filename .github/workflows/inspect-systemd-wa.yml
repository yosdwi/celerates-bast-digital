name: Inspect Actual WhatsApp Runtime

on:
  push:
    branches:
      - ops/deploy-wa-session-once-20260829
    paths:
      - .github/workflows/inspect-systemd-wa.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Trace WhatsApp process owner read-only
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' <<'REMOTE'
          set +e
          echo '=== node processes with unit/cgroup ==='
          ps -eo unit,pid,ppid,user,lstart,cmd | grep -E 'node (docker/main\.js|server\.js)' | grep -v grep || true
          for pid in $(ps -eo pid,cmd | awk '/node docker\/main\.js/ && !/awk/ {print $1}'); do
            echo "=== PID $pid ==="
            echo '-- cwd --'
            readlink -f "/proc/$pid/cwd" || true
            echo '-- cmdline --'
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null; echo
            echo '-- cgroup --'
            cat "/proc/$pid/cgroup" 2>/dev/null || true
            echo '-- parent tree --'
            pstree -sp "$pid" 2>/dev/null || true
            echo '-- systemctl status PID --'
            systemctl status "$pid" --no-pager 2>&1 | head -n 35 || true
          done
          echo '=== running services with MainPID ==='
          systemctl list-units --type=service --state=running --no-legend --no-pager | awk '{print $1}' | while read -r unit; do
            mainpid=$(systemctl show "$unit" -p MainPID --value 2>/dev/null)
            [ "$mainpid" != '0' ] || continue
            cmd=$(tr '\0' ' ' < "/proc/$mainpid/cmdline" 2>/dev/null)
            case "$cmd" in
              *node*|*npm*|*pm2*) printf '%s pid=%s cmd=%s\n' "$unit" "$mainpid" "$cmd" ;;
            esac
          done
          echo '=== erroneous docker wa container ==='
          docker ps -a --filter 'name=digital-bast-v2-wa-session-1' --format 'name={{.Names}} status={{.Status}} image={{.Image}}' 2>/dev/null || true
          REMOTE
