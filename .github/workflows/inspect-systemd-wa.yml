name: Inspect Actual WhatsApp Runtime

on:
  push:
    branches:
      - ops/deploy-wa-session-once-20260829
    paths:
      - .github/workflows/inspect-systemd-wa.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect systemd and processes read-only
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' <<'REMOTE'
          set +e
          echo '=== matching systemd units ==='
          systemctl list-units --type=service --all --no-pager | grep -Ei 'wa|whatsapp|bast|bot|bridge|session' || true
          echo '=== matching unit files ==='
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'wa|whatsapp|bast|bot|bridge|session' || true
          echo '=== matching processes ==='
          ps -eo pid,ppid,user,lstart,cmd | grep -Ei 'node|wa-session|whatsapp|baileys|bot-bridge|bot-worker' | grep -v grep || true
          echo '=== listeners ==='
          ss -ltnp 2>/dev/null | grep -E ':8090|:8091' || true
          echo '=== candidate unit definitions ==='
          for unit in $(systemctl list-unit-files --type=service --no-legend --no-pager | awk '{print $1}' | grep -Ei 'wa|whatsapp|bast|bot|bridge|session'); do
            echo "--- $unit ---"
            systemctl show "$unit" -p ActiveState -p SubState -p MainPID -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager || true
            systemctl cat "$unit" --no-pager 2>/dev/null || true
          done
          echo '=== erroneous docker wa container ==='
          docker ps -a --filter 'name=digital-bast-v2-wa-session-1' --format 'name={{.Names}} status={{.Status}} image={{.Image}}' 2>/dev/null || true
          REMOTE
