name: Format Whatsmeow Once

on:
  push:
    branches:
      - feat/whatsmeow-transport
    paths:
      - ".github/workflows/format-whatsmeow-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsmeow-transport
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false
      - name: Format and commit
        run: |
          gofmt -w whatsmeow-session
          if git diff --quiet -- 'whatsmeow-session/*.go'; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'whatsmeow-session/*.go'
          git commit -m 'style: format whatsmeow transport with Go 1.26'
          git push origin HEAD:feat/whatsmeow-transport
