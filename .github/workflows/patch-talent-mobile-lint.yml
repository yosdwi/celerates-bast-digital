name: Patch Talent Mobile Lint Once

on:
  push:
    branches:
      - feat/talent-mobile-evidence-ux
    paths:
      - .github/workflows/patch-talent-mobile-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/talent-mobile-evidence-ux
      - name: Patch type-only DateRange import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/digital_bast/web/talent_mobile_router.py')
          text = path.read_text()
          text = text.replace('from typing import Annotated\n', 'from typing import TYPE_CHECKING, Annotated\n', 1)
          text = text.replace('from digital_bast.domain.completion import DateRange\n', '', 1)
          needle = 'from digital_bast.web.talent_mobile_contracts import (\n'
          block = 'if TYPE_CHECKING:\n    from digital_bast.domain.completion import DateRange\n\n\n'
          if block not in text:
              text = text.replace(needle, block + needle, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/digital_bast/web/talent_mobile_router.py
          git commit -m "fix: keep DateRange as type-only mobile router import"
          git push origin HEAD:feat/talent-mobile-evidence-ux
