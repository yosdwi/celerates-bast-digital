name: Patch Talent Mobile Env Once

on:
  push:
    branches:
      - feat/talent-mobile-evidence-ux
    paths:
      - .github/workflows/patch-talent-mobile-env.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/talent-mobile-evidence-ux
          fetch-depth: 0
      - name: Patch compose and env example
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path('compose.yaml')
          text = compose.read_text()
          needle = '    BOT_BRIDGE_BASE_URL: ${BOT_BRIDGE_BASE_URL:-http://wa-session:8090}\n'
          replacement = needle + '    # Public origin of this same Digital BAST/TalentOps web app. Used only to\n    # build short-lived signed Talent mobile links sent in WhatsApp DM.\n    TALENTOPS_PUBLIC_URL: ${TALENTOPS_PUBLIC_URL:-}\n'
          if 'TALENTOPS_PUBLIC_URL:' not in text:
              if needle not in text:
                  raise SystemExit('compose insertion point not found')
              compose.write_text(text.replace(needle, replacement, 1))

          env = Path('.env.example')
          env_text = env.read_text()
          marker = 'APP_SESSION_SECRET_FILE=/run/secrets/session_secret\n'
          addition = marker + '# Public URL of the same Digital BAST/TalentOps app, e.g. https://bast.example.com\n# Required for signed mobile Attendance / Task Evidence links sent from WhatsApp.\nTALENTOPS_PUBLIC_URL=\n'
          if 'TALENTOPS_PUBLIC_URL=' not in env_text:
              if marker not in env_text:
                  raise SystemExit('.env insertion point not found')
              env.write_text(env_text.replace(marker, addition, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.yaml .env.example
          git commit -m "feat: pass TalentOps public URL to mobile link generator"
          git push origin HEAD:feat/talent-mobile-evidence-ux
