name: Cherry Pick Attendance Fix Once

on:
  push:
    branches:
      - feat/talent-mobile-evidence-ux
    paths:
      - .github/workflows/cherry-pick-attendance-fix.yml

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/talent-mobile-evidence-ux
          fetch-depth: 0
      - name: Cherry-pick PR 56 regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin f98b41367d7775e048b56535dffb43582c22e1a2
          git cherry-pick f98b41367d7775e048b56535dffb43582c22e1a2
          git push origin HEAD:feat/talent-mobile-evidence-ux
