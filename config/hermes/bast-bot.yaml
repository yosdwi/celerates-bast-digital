# Hermes Agent configuration for the Digital BAST WhatsApp group bot (V1).
# Hermes only parses intent, calls an allowlisted command and posts the result.
# All business rules live in `digital-bast`, never in the agent prompt.
name: bast-bot
description: Digital BAST WhatsApp group assistant
channel:
  transport: whatsapp-baileys
  mode: group
  respond_to: mention_only        # group messages: ignore anything that doesn't mention the bot
  allowed_groups:                 # fill with the group JIDs that may use the bot
    - "REPLACE_WITH_GROUP_JID@g.us"
  allow_direct_messages: true     # DM = evidence upload only, scoped below -- not open reporting
  # Command surface is scoped per channel (docs/bast-e2e-plan.md §3.3):
  #   allowlisted group : resume / status / export / generate -- unchanged
  #   DM, bound JID      : evidence listing and upload only
  #   DM, unbound JID     : activation attempt only, rate-limited, nothing else
  # digital-bast enforces this scoping itself (cli.py::_dm_reply / bot_evidence);
  # this config only documents it, it isn't a separate access-control layer.
runtime:
  working_directory: /opt/digital-bast
  timeout_seconds: 120
  # Preferred integration: forward the raw message, receive the finished reply.
  primary_command:
    executable: digital-bast
    arguments: ["bot-reply", "--text", "{{message}}"]
# Direct commands, used only when the caller already knows the ISO date range.
# Nothing outside this list may be executed; no shell, no docker mutation.
allowlist:
  - executable: digital-bast
    arguments: ["completion-status", "--start-date", "{{start_date}}", "--end-date", "{{end_date}}", "--format", "text"]
  - executable: digital-bast
    arguments: ["export-attendance", "--start-date", "{{start_date}}", "--end-date", "{{end_date}}", "--label", "{{label}}", "--output", "{{output}}"]
  - executable: digital-bast
    arguments: ["generate-bast", "--start-date", "{{start_date}}", "--end-date", "{{end_date}}", "--output", "{{output}}"]
  - executable: digital-bast
    arguments: ["system-status", "--format", "text"]
denied_intents:
  - restart / stop / start container
  - docker compose up / down / exec
  - arbitrary shell execution
  - reporting or document generation from a direct message (group-only, see channel scoping above)
reply_language: id-ID
