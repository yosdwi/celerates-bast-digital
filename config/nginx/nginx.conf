worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16m;
    proxy_connect_timeout 5s;
    # 300s: TalentOps AI (Ollama, CPU-only, no GPU on this box) took 81s
    # end-to-end against a real command-center context (~3.7k prompt tokens)
    # -- 60s cut it off before the model finished. Its own OllamaChatClient
    # timeout (110s) still fires first and returns a graceful
    # {"status":"unavailable"} JSON, so raising this ceiling doesn't change
    # that behavior. Raised past 115s because BAST PDF generation
    # (bast/generate) renders one headless-Chromium page-capture per report
    # page sequentially (pdf_export.py) -- a month with many evidence photos
    # or employees produces dozens of pages and can run past 115s even when
    # it succeeds, which nginx was cutting off with a bare 504 before the
    # backend ever got to respond.
    proxy_read_timeout 300s;
    include /etc/nginx/conf.d/active-slot.conf;
}
