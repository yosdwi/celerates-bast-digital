worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16m;
    proxy_connect_timeout 5s;
    # 115s, not 60s: TalentOps AI (Ollama, CPU-only, no GPU on this box) took
    # 81s end-to-end against a real command-center context (~3.7k prompt
    # tokens) -- 60s cut it off before the model finished. Kept just under
    # OllamaChatClient's own 110s timeout so the app can still return its own
    # graceful {"status":"unavailable"} JSON instead of nginx returning a bare
    # 504 first.
    proxy_read_timeout 115s;
    include /etc/nginx/conf.d/active-slot.conf;
}
