[project]
name = "celerates-bast-digital"
version = "0.1.0"
description = "Digital BAST operational platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "bcrypt>=4.2,<5",
    "fastapi>=0.116,<1",
    "google-api-python-client>=2.179,<3",
    "google-auth>=2.40,<3",
    "holidays>=0.76,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "prefect[redis]>=3.4,<4",
    "psycopg[binary]>=3.2,<4",
    "playwright>=1.48,<2",
    "pydantic-settings>=2.10,<3",
    "pymssql>=2.3,<3",
    "pyodbc>=5.2,<6",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
digital-bast = "digital_bast.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "starlette[full]>=1.3,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_bast"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "FBT001", "FBT002", "FIX002", "ISC001", "TD002", "TD003"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/digital_bast/**/__init__.py" = ["D104"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]
"typings/googleapiclient/discovery.pyi" = ["N802", "N803"]
# Standalone one-off CLI scripts, never imported as a package -- prints are
# their entire user-facing output, not something to route through logging.
"scripts/*.py" = ["INP001", "T201"]
# bridge/pama_bridge.py ships standalone to a Windows PC outside this package,
# so it cannot import digital_bast and its console output is the whole UI.
"bridge/*.py" = ["INP001", "T201", "TRY003", "EM101", "EM102"]
# Tests for the standalone bridge live beside it rather than under tests/.
"bridge/test_*.py" = ["FURB192", "PLR2004", "S101"]
# Workflow V2 orchestration deliberately mirrors FastAPI parameters, database
# records, and conversational decision trees. Keep these narrow exemptions on
# the orchestration boundaries rather than weakening project-wide lint rules.
"src/digital_bast/application/workflow_control.py" = ["E501", "FBT003", "PLR0911", "PLR0913", "PLR0917", "PLR2004", "RUF100"]
"src/digital_bast/bot/dm_workflow.py" = ["ARG001", "E501", "PLR0911", "PLR2004", "RET504", "RUF100"]
"src/digital_bast/bot/pmo_workflow.py" = ["E501", "PERF401", "PLR0911", "PLR0912", "PLR2004", "RUF100", "TC003"]
"src/digital_bast/bot/rebind.py" = ["E501", "F401", "TC003"]
"src/digital_bast/bot/rebind_onboarding.py" = ["E501"]
"src/digital_bast/infrastructure/talentops_followup_store.py" = ["TC003"]
"src/digital_bast/web/production.py" = ["E501"]
"src/digital_bast/web/talentops_router.py" = ["E501", "PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
