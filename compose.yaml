x-app: &app
  image: ${APP_IMAGE:-digital-bast:local}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  group_add:
    - "${SECRETS_GID:?SECRETS_GID is required}"
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &app-environment
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    APP_TIMEZONE: Asia/Jakarta
    TZ: Asia/Jakarta
    HOME: /tmp
    PREFECT_HOME: /tmp/prefect
    PREFECT_UI_STATIC_DIRECTORY: /tmp/prefect-ui
    DIGITAL_BAST_RUN_CONTEXT_FACTORY: digital_bast.flows.production:create_run_context
    DIGITAL_BAST_DISABLED_OPERATIONS: attendance-import,redmine-import
    APP_SESSION_SECRET_FILE: /run/secrets/session_secret
    APP_DATABASE_DSN_FILE: /run/secrets/app_database_dsn
    LEGACY_DATABASE_DSN_FILE: /run/secrets/legacy_database_dsn
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_DATABASE_DSN_FILE: /run/secrets/prefect_database_dsn
    REDIS_URL_FILE: /run/secrets/redis_url
    NOCODB_BASE_URL: ${NOCODB_BASE_URL:?NOCODB_BASE_URL is required}
    NOCODB_TOKEN_FILE: /run/secrets/nocodb_token
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    SQLSERVER_CONNECTION_STRING_FILE: /run/secrets/sqlserver_connection_string
  secrets: &app-secrets
    - session_secret
    - app_database_dsn
    - legacy_database_dsn
    - prefect_api_auth
    - prefect_database_dsn
    - redis_url
    - nocodb_token
    - google_service_account
    - sqlserver_connection_string
  networks:
    - backend
    - egress
    - digital-bast-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 768M
      reservations:
        memory: 192M

x-prefect: &prefect
  <<: *app
  environment:
    TZ: Asia/Jakarta
    HOME: /tmp
    PREFECT_HOME: /tmp/prefect
    PREFECT_UI_STATIC_DIRECTORY: /tmp/prefect-ui
    PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_API_DATABASE_CONNECTION_URL_FILE: /run/secrets/prefect_database_dsn
    PREFECT_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_SERVER_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_MESSAGING_BROKER: digital_bast.prefect_redis_safe
    PREFECT_MESSAGING_CACHE: prefect_redis.messaging
    PREFECT_REDIS_MESSAGING_URL_FILE: /run/secrets/redis_url
  secrets:
    - prefect_database_dsn
    - prefect_api_auth
    - redis_url
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/digital-bast-postgres-entrypoint"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digital_bast}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Jakarta
    secrets:
      - postgres_password
      - app_database_password
      - prefect_database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/usr/local/bin/digital-bast-postgres-entrypoint:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-digital-bast-databases.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--appendonly", "yes", "--save", "60", "1000"]
    group_add:
      - "${SECRETS_GID:?SECRETS_GID is required}"
    secrets:
      - redis_acl
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    security_opt:
      - no-new-privileges:true

  prefect-server:
    <<: *prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--no-services"]
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import base64,urllib.request; a=open('/run/secrets/prefect_api_auth').read().strip(); r=urllib.request.Request('http://127.0.0.1:4200/api/health',headers={'Authorization':'Basic '+base64.b64encode(a.encode()).decode()}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  prefect-services:
    <<: *prefect
    command: ["prefect", "server", "services", "start"]
    depends_on:
      prefect-server:
        condition: service_healthy

  web-blue:
    <<: *app
    profiles: ["blue"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker-blue:
    <<: *app
    profiles: ["blue"]
    command: ["prefect", "worker", "start", "--pool", "${APP_WORK_POOL:-digital-bast-app}", "--type", "process"]

  runner-blue:
    <<: *app
    profiles: ["blue"]
    command: ["digital-bast", "serve"]

  web-green:
    <<: *app
    profiles: ["green"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker-green:
    <<: *app
    profiles: ["green"]
    command: ["prefect", "worker", "start", "--pool", "${APP_WORK_POOL:-digital-bast-app}", "--type", "process"]

  runner-green:
    <<: *app
    profiles: ["green"]
    command: ["digital-bast", "serve"]

  reverse-proxy:
    image: nginx:1.27.1-alpine
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0700
      - /var/run:size=4m,uid=101,gid=101,mode=0700
      - /tmp:size=16m,uid=101,gid=101,mode=0700
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/active-slot.conf:/etc/nginx/conf.d/active-slot.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  app_database_password:
    file: ${SECRETS_DIR:-./secrets}/app_database_password
  prefect_database_password:
    file: ${SECRETS_DIR:-./secrets}/prefect_database_password
  session_secret:
    file: ${SECRETS_DIR:-./secrets}/session_secret
  app_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/app_database_dsn
  legacy_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/legacy_database_dsn
  prefect_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/prefect_database_dsn
  prefect_api_auth:
    file: ${SECRETS_DIR:-./secrets}/prefect_api_auth
  redis_url:
    file: ${SECRETS_DIR:-./secrets}/redis_url
  redis_acl:
    file: ${SECRETS_DIR:-./secrets}/redis_acl
  nocodb_token:
    file: ${SECRETS_DIR:-./secrets}/nocodb_token
  google_service_account:
    file: ${SECRETS_DIR:-./secrets}/google_service_account.json
  sqlserver_connection_string:
    file: ${SECRETS_DIR:-./secrets}/sqlserver_connection_string

networks:
  edge:
  backend:
    internal: true
  egress:
  digital-bast-network:
    external: true
    name: digital-bast-network

volumes:
  postgres-data:
  redis-data:
