# Docker's json-file driver has no size limit by default -- a long-running
# container's stdout/stderr can silently grow into gigabytes (found one at
# 2.7GB, another at 338MB, 2026-08-31) and was the actual cause of the disk
# preflight gate failing repeatedly, not the box being genuinely undersized.
# Applied to every service below so this can't recur for any of them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-digital-bast:local}
  logging: *default-logging
  build:
    context: .
    target: runtime
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  group_add:
    - "${SECRETS_GID:?SECRETS_GID is required}"
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Ollama runs on the host (not a container), bound to 0.0.0.0:11434 with
  # ufw scoped to this box's compose networks. host-gateway resolves
  # correctly regardless of which attached network Docker treats as primary,
  # unlike a hardcoded bridge gateway IP -- see bot-worker's own copy of this,
  # which predates web-blue/web-green needing it for TalentOps AI.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &app-environment
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    APP_TIMEZONE: Asia/Jakarta
    TZ: Asia/Jakarta
    HOME: /tmp
    PREFECT_HOME: /tmp/prefect
    PREFECT_UI_STATIC_DIRECTORY: /tmp/prefect-ui
    DIGITAL_BAST_RUN_CONTEXT_FACTORY: digital_bast.flows.production:create_run_context
    DIGITAL_BAST_DISABLED_OPERATIONS: attendance-import,redmine-import
    APP_SESSION_SECRET_FILE: /run/secrets/session_secret
    APP_DATABASE_DSN_FILE: /run/secrets/app_database_dsn
    LEGACY_DATABASE_DSN_FILE: /run/secrets/legacy_database_dsn
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_DATABASE_DSN_FILE: /run/secrets/prefect_database_dsn
    REDIS_URL_FILE: /run/secrets/redis_url
    NOCODB_BASE_URL: ${NOCODB_BASE_URL:-}
    NOCODB_TOKEN_FILE: /run/secrets/nocodb_token
    NOCODB_DATABASE_DSN_FILE: /run/secrets/nocodb_database_dsn
    NOCODB_BASE_ID: ${NOCODB_BASE_ID:?NOCODB_BASE_ID is required}
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    SQLSERVER_CONNECTION_STRING_FILE: /run/secrets/sqlserver_connection_string
    SYNC_INGEST_TOKEN_FILE: /run/secrets/sync_ingest_token
    # Web -> official Meta Cloud API gateway, internal Docker network only.
    # TalentOps consumes a narrow provider/readiness status; there is no QR,
    # pairing code, linked-device state, or WhatsApp Web session.
    BOT_BRIDGE_BASE_URL: ${BOT_BRIDGE_BASE_URL:-http://meta-wa-gateway:8090}
    # Bootstrap/backward-compatible fallback only. Admin can save the active
    # Talent Mobile public origin from TalentOps Settings without editing env.
    TALENTOPS_PUBLIC_URL: ${TALENTOPS_PUBLIC_URL:-}
    # scripts/sheet_replay_poller.py: a distinct credential and sheet from
    # the IoT sheet's (that one is dead -- invalid_grant). Optional -- the
    # poller is the only thing that reads it, and only when actually invoked.
    GOOGLE_SHEETS_RELAY_CREDENTIALS: /run/secrets/google_sheets_relay_credentials
    GOOGLE_SHEETS_RELAY_SHEET_ID: ${GOOGLE_SHEETS_RELAY_SHEET_ID:-}
    # TalentOps AI (application/talentops_ai.py) reads this the same way the
    # WhatsApp bot does -- see bot-worker's BOT_LLM_URL below, same host.
    BOT_LLM_URL: ${BOT_LLM_URL:-}
    BOT_LLM_MODEL: ${BOT_LLM_MODEL:-llama3.2:3b}
    # TalentOps AI provider -- defaults to ollama (groq/cloudflare below are
    # no-ops unless selected via LLM_PROVIDER). Ollama on this CPU-only,
    # RAM-constrained box OOM-killed itself under a real command-center
    # prompt (2026-08-25). Groq's free-tier openai/gpt-oss-20b then rejected
    # that same prompt outright (413, ~11k tokens vs its 8k TPM-per-request
    # cap, 2026-08-28) -- Cloudflare Workers AI is the current choice.
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    CLOUDFLARE_WORKERS_AI_MODEL: ${CLOUDFLARE_WORKERS_AI_MODEL:-@cf/qwen/qwen3-30b-a3b-fp8}
  secrets: &app-secrets
    - session_secret
    - app_database_dsn
    - legacy_database_dsn
    - prefect_api_auth
    - prefect_database_dsn
    - redis_url
    - nocodb_token
    - nocodb_database_dsn
    - google_service_account
    - sqlserver_connection_string
    - sync_ingest_token
    - google_sheets_relay_credentials
    - groq_api_key
    - cloudflare_api_token
  networks:
    - backend
    - egress
    - digital-bast-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 768M
      reservations:
        memory: 192M

x-prefect: &prefect
  <<: *app
  environment:
    TZ: Asia/Jakarta
    HOME: /tmp
    PREFECT_HOME: /tmp/prefect
    PREFECT_UI_STATIC_DIRECTORY: /tmp/prefect-ui
    PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    PREFECT_SERVER_UI_API_URL: ${PREFECT_SERVER_UI_API_URL:-http://127.0.0.1:4200/api}
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_API_DATABASE_CONNECTION_URL_FILE: /run/secrets/prefect_database_dsn
    PREFECT_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_SERVER_API_AUTH_STRING_FILE: /run/secrets/prefect_api_auth
    PREFECT_MESSAGING_BROKER: digital_bast.prefect_redis_safe
    PREFECT_MESSAGING_CACHE: prefect_redis.messaging
    PREFECT_REDIS_MESSAGING_URL_FILE: /run/secrets/redis_url
  secrets:
    - prefect_database_dsn
    - prefect_api_auth
    - redis_url
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/usr/local/bin/digital-bast-postgres-entrypoint"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digital_bast}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Jakarta
    secrets:
      - postgres_password
      - app_database_password
      - prefect_database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/usr/local/bin/digital-bast-postgres-entrypoint:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-digital-bast-databases.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--appendonly", "yes", "--save", "60", "1000"]
    group_add:
      - "${SECRETS_GID:?SECRETS_GID is required}"
    secrets:
      - redis_acl
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    security_opt:
      - no-new-privileges:true

  prefect-server:
    <<: *prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--no-services"]
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import base64,urllib.request; a=open('/run/secrets/prefect_api_auth').read().strip(); r=urllib.request.Request('http://127.0.0.1:4200/api/health',headers={'Authorization':'Basic '+base64.b64encode(a.encode()).decode()}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  prefect-services:
    <<: *prefect
    command: ["prefect", "server", "services", "start"]
    depends_on:
      prefect-server:
        condition: service_healthy

  web-blue:
    <<: *app
    profiles: ["blue"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-green:
    <<: *app
    profiles: ["green"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: ["prefect", "worker", "start", "--pool", "${APP_WORK_POOL:-digital-bast-app}", "--type", "process"]

  runner:
    <<: *app
    command: ["digital-bast", "serve"]

  reverse-proxy:
    image: nginx:1.27.1-alpine
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0700
      - /var/run:size=4m,uid=101,gid=101,mode=0700
      - /tmp:size=16m,uid=101,gid=101,mode=0700
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/active-slot.conf:/etc/nginx/conf.d/active-slot.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # Was port 8083 (avoiding 8082, which a pre-existing cloudflared ingress
  # rule maps adminpanel.celeratesapps.com to -- binding that here would have
  # silently published this database editor to the public internet, where
  # NocoDB's first-boot flow lets any visitor claim the admin account).
  #
  # Now on 8081: the pre-existing nocodb_bast application container (the one
  # that previously held that port, and the app's admin login backend --
  # web/nocodb_postgres_auth.py -- authenticates against its Postgres
  # database, NOT its own container) has been retired as unused. Confirmed
  # via `docker port` that 8081, not 8082, was its actual bound port before
  # removal, so this move does not touch the 8082 exposure risk described
  # above. Its database (a separate host, unrelated to this compose project)
  # and its own data volume are both untouched -- only the NocoDB
  # application container was removed.
  #
  # NocoDB-v2: a second, independent instance whose data source is this
  # stack's own Postgres, so the grids people edit ARE the rows the pipeline
  # writes -- no sync, no second copy.
  nocodb-v2:
    image: nocodb/nocodb:0.301.2
    restart: unless-stopped
    logging: *default-logging
    environment:
      NC_DB: "pg://postgres:5432?u=${NOCODB_V2_DB_USER:-digital_bast_app}&p=${NOCODB_V2_DB_PASSWORD:?NOCODB_V2_DB_PASSWORD is required}&d=nocodb_v2_meta"
      NC_PUBLIC_URL: ${NOCODB_V2_PUBLIC_URL:-http://127.0.0.1:8081}
      NC_DISABLE_TELE: "true"
    ports:
      - "127.0.0.1:${NOCODB_V2_PORT:-8081}:8080"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nocodb-v2-data:/usr/app/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # Official WhatsApp Business Platform transport. Meta owns connection and
  # delivery lifecycle; this service owns only authenticated webhooks, Graph
  # API calls, media handoff, interactive rendering, and durable idempotency.
  meta-wa-gateway:
    build:
      context: .
      dockerfile: meta-wa-gateway/Dockerfile
    image: ${META_WA_GATEWAY_IMAGE:-digital-bast-meta-wa-gateway:local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      META_WA_GATEWAY_HOST: 0.0.0.0
      META_WA_GATEWAY_PORT: "8090"
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:?META_GRAPH_VERSION is required}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:?META_WA_PHONE_NUMBER_ID is required}
      META_WA_DISPLAY_PHONE_NUMBER: ${META_WA_DISPLAY_PHONE_NUMBER:-}
      META_WA_ACCESS_TOKEN_FILE: /run/secrets/meta_wa_access_token
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      META_WEBHOOK_VERIFY_TOKEN_FILE: /run/secrets/meta_webhook_verify_token
      META_DEFAULT_UTILITY_TEMPLATE: ${META_DEFAULT_UTILITY_TEMPLATE:-bast_action_required_v1}
      META_TEMPLATE_LANGUAGE: ${META_TEMPLATE_LANGUAGE:-id}
      APP_DATABASE_DSN_FILE: /run/secrets/app_database_dsn
      BOT_BRIDGE_TOKEN_FILE: /run/secrets/sync_ingest_token
      BOT_DATA_DIR: /data
      BOT_WORKER_BASE_URL: ${BOT_WORKER_BASE_URL:-http://bot-worker:8091}
    secrets:
      - sync_ingest_token
      - app_database_dsn
      - meta_wa_access_token
      - meta_app_secret
      - meta_webhook_verify_token
    group_add:
      - "${SECRETS_GID:?SECRETS_GID is required}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - egress
      - digital-bast-network
    volumes:
      - bot-bridge-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # Stateless HTTP wrapper around the `digital-bast` CLI -- the business/LLM
  # logic half of the former single bot-bridge process. Holds no WhatsApp
  # state, so scripts/deploy.sh rebuilds and recreates it on every deploy
  # exactly like the combined service used to, harmlessly: there is no live
  # session here to interrupt.
  bot-worker:
    build:
      context: .
      dockerfile: bot-worker/Dockerfile
      args:
        APP_IMAGE: ${APP_IMAGE:-digital-bast:local}
    image: ${BOT_WORKER_IMAGE:-digital-bast-bot-worker:local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *app-environment
      BAST_CLI: digital-bast
      BOT_LLM_URL: ${BOT_LLM_URL:-}
      BOT_LLM_MODEL: ${BOT_LLM_MODEL:-llama3.2:3b}
      BOT_WORKER_HOST: 0.0.0.0
      BOT_WORKER_PORT: "8091"
      # The Meta gateway hands off exported BAST/status-matrix files and
      # evidence uploads through the shared volume below.
      BAST_EXPORTS_DIR: /data/exports
    secrets: *app-secrets
    group_add:
      - "${SECRETS_GID:?SECRETS_GID is required}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
      - egress
      - digital-bast-network
    # BOT_LLM_URL targets this -- Ollama runs on the host (not a container),
    # bound to 0.0.0.0:11434 with ufw scoped to just this container's actual
    # bridge subnets (see scripts/deploy.sh-adjacent infra notes). host-gateway
    # resolves correctly regardless of which of the three attached networks
    # Docker treats as primary, unlike a hardcoded bridge gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot-bridge-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # 768M (inherited from the pre-split combined bot-bridge) OOM-kills
          # Chromium mid-render for a real BAST PDF export (html2canvas +
          # jsPDF via pdf_export.py -- confirmed via docker inspect
          # .State.OOMKilled=true, 2026-08-29). 1.5G gives that a real margin
          # without eating meaningfully into the host's ~2GB free headroom.
          memory: 1.5G

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  app_database_password:
    file: ${SECRETS_DIR:-./secrets}/app_database_password
  prefect_database_password:
    file: ${SECRETS_DIR:-./secrets}/prefect_database_password
  session_secret:
    file: ${SECRETS_DIR:-./secrets}/session_secret
  app_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/app_database_dsn
  legacy_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/legacy_database_dsn
  prefect_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/prefect_database_dsn
  prefect_api_auth:
    file: ${SECRETS_DIR:-./secrets}/prefect_api_auth
  redis_url:
    file: ${SECRETS_DIR:-./secrets}/redis_url
  redis_acl:
    file: ${SECRETS_DIR:-./secrets}/redis_acl
  nocodb_token:
    file: ${SECRETS_DIR:-./secrets}/nocodb_token
  nocodb_database_dsn:
    file: ${SECRETS_DIR:-./secrets}/nocodb_database_dsn
  google_service_account:
    file: ${SECRETS_DIR:-./secrets}/google_service_account.json
  groq_api_key:
    file: ${SECRETS_DIR:-./secrets}/groq_api_key
  cloudflare_api_token:
    file: ${SECRETS_DIR:-./secrets}/cloudflare_api_token
  sqlserver_connection_string:
    file: ${SECRETS_DIR:-./secrets}/sqlserver_connection_string
  sync_ingest_token:
    file: ${SECRETS_DIR:-./secrets}/sync_ingest_token
  google_sheets_relay_credentials:
    file: ${SECRETS_DIR:-./secrets}/google_sheets_relay_credentials.json
  meta_wa_access_token:
    file: ${SECRETS_DIR:-./secrets}/meta_wa_access_token
  meta_app_secret:
    file: ${SECRETS_DIR:-./secrets}/meta_app_secret
  meta_webhook_verify_token:
    file: ${SECRETS_DIR:-./secrets}/meta_webhook_verify_token

networks:
  edge:
  backend:
    internal: true
  egress:
  digital-bast-network:
    external: true
    name: digital-bast-network

volumes:
  postgres-data:
  redis-data:
  nocodb-v2-data:
  bot-bridge-data:
