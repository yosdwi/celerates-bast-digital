{% extends "base.html" %}
{% block title %}Progressive generator | Digital BAST{% endblock %}
{% block body %}<main class="content narrow"><a href="/admin/">Back</a><header><p class="eyebrow">Report generation</p><h1>Progressive generator</h1><p class="muted">Plan {{ plan_id }}</p></header><section class="panel"><p>Generate report sections one at a time, then continue to the editor.</p><form action="/api/generate/section" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="plan_id" value="{{ plan_id }}"><label>Section number<input type="number" name="section_id" min="0" value="0"></label><button type="submit">Generate section</button></form><a class="button secondary" href="/admin/report-editor?plan_id={{ plan_id | urlencode }}">Open report editor</a></section></main>{% endblock %}
