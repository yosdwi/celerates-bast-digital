{% extends "base.html" %}
{% block title %}Sign in | TalentOps{% endblock %}
{% block body %}
<main class="to-login-shell">
  <section class="to-login-card" aria-labelledby="login-title">
    <div class="to-login-mark" aria-hidden="true">T</div>
    <p class="to-login-eyebrow">Celerates</p>
    <h1 id="login-title">TalentOps</h1>
    <p class="to-login-subtitle">Sign in to continue</p>
    {% if error %}<div class="to-login-alert" role="alert">{{ error }}</div>{% endif %}
    <form action="/admin/auth/login" method="post" class="to-login-form">
      <label>Email address<input name="email" type="email" autocomplete="username" required maxlength="320"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button type="submit">Sign in</button>
    </form>
    <p class="to-login-note">Secure access for authorized owners only</p>
  </section>
</main>
{% endblock %}
